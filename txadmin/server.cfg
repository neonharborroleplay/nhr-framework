# NHR Framework - generated through the txAdmin recipe
{{serverEndpoints}}

sv_maxclients {{maxClients}}
sv_licenseKey "{{svLicense}}"
sv_scriptHookAllowed 0

sets sv_projectName "{{serverName}}"
sets sv_projectDesc "NHR Framework roleplay server"
sets tags "roleplay,nhr,custom,economy,jobs"
sets locale "en-US"
sv_hostname "{{serverName}} | NHR Framework"

set mysql_connection_string "{{dbConnectionString}}"

# Voice
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableUi 1

# ox_target
setr ox_target:toggleHotkey 0
setr ox_target:defaultHotkey LMENU
setr ox_target:drawSprite 1
setr ox_target:defaults 1

# Cfx.re defaults
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

# Runtime dependencies
ensure oxmysql
ensure ox_lib
ensure ox_target
ensure pma-voice

# NHR foundation and shared services
ensure nhr_core
ensure nhr_logs
ensure nhr_security
ensure nhr_health
ensure nhr_world
ensure nhr_chat
ensure nhr_scoreboard
ensure nhr_emotes

# Characters, player state, and vehicles
ensure nhr_multichar
ensure nhr_spawn
ensure nhr_vehicles
ensure nhr_vehiclekeys
ensure nhr_fuel
ensure nhr_inventory
ensure nhr_shops
ensure nhr_banking
ensure nhr_status
ensure nhr_hud

# Vehicle ownership and services
ensure nhr_dealership
ensure nhr_garages
ensure nhr_vehiclemarket

# Careers and government
ensure nhr_jobs
ensure nhr_cityhall
ensure nhr_drivingschool
ensure nhr_management
ensure nhr_dispatch
ensure nhr_evidence
ensure nhr_police
ensure nhr_ambulance
ensure nhr_admin

# World, property, and communication
ensure nhr_doorlocks
ensure nhr_housing
ensure nhr_appearance
ensure nhr_phone
ensure nhr_mdt

# Economy and activities
ensure nhr_crafting
ensure nhr_robberies
ensure nhr_finance
ensure nhr_economy
ensure nhr_customs
ensure nhr_businesses
ensure nhr_billing
ensure nhr_trade
ensure nhr_radio
ensure nhr_weapons

# NHR permission nodes. Add administrators in txAdmin; it manages group.admin.
add_ace group.admin nhr.admin allow
add_ace group.admin nhr.mod allow
